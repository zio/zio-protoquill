# This file was autogenerated using `zio-sbt-ci` plugin via `sbt ciGenerateGithubWorkflow`
# task and should be included in the git repository. Please do not edit it manually.

name: CI
env:
  JAVA_OPTS: -Xms8G -Xmx8G -XX:+UseParallelGC -XX:ReservedCodeCacheSize=256m -XX:+TieredCompilation -Dcommunity=false -Dquill.macro.log=false --add-exports java.base/sun.nio.ch=ALL-UNNAMED
  JDK_JAVA_OPTIONS: -Xms8G -Xmx8G -XX:+UseParallelGC -XX:ReservedCodeCacheSize=256m -XX:+TieredCompilation -Dcommunity=false -Dquill.macro.log=false --add-exports java.base/sun.nio.ch=ALL-UNNAMED
'on':
  workflow_dispatch: {}
  release:
    types:
    - published
  push:
    branches:
    - master
  pull_request:
    branches-ignore:
    - gh-pages
permissions:
  id-token: write
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        scala:
        - 3.8.4
        module:
        - sqltest
        - db
        - bigdata
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Scala ${{ matrix.scala }} Building ${{ matrix.module }}
      run: |
        echo "SCALA_VERSION='$SCALA_VERSION'"
        ./build/build.sh ${{ matrix.module }}
      env:
        SCALA_VERSION: ${{ matrix.scala }}
  ci:
    name: ci
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - build
    if: always()
    steps:
    - name: Report Failed CI
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: 'echo "ci failed: one or more required jobs did not succeed"; exit 1'
    - name: Report Successful CI
      run: echo "ci passed"
  release:
    name: Release
    runs-on: ubuntu-latest
    continue-on-error: false
    needs:
    - ci
    if: ${{ (((github.event_name == 'release') && (github.event.action == 'published')) || (github.event_name == 'workflow_dispatch')) || ((github.event_name == 'push') && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: '0'
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Setup Scala
      uses: actions/setup-java@v6.0.1
      with:
        distribution: corretto
        java-version: '17'
        check-latest: true
    - name: Setup SBT
      uses: sbt/setup-sbt@v1.5.7
    - name: Cache Dependencies
      uses: coursier/cache-action@v8.1.1
    - name: Release
      run: sbt --no-colors ci-release
      env:
        PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        PGP_SECRET: ${{ secrets.PGP_SECRET }}
        SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
